name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (shim + binaries)
        run: bash scripts/build-release.sh

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/git-snapshot-darwin-arm64
            dist/git-snapshot-darwin-x64
            dist/git-snapshot-linux-x64
            dist/git-snapshot-win32-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          corepack enable
          npm install -g npm@latest
          npm publish --provenance
